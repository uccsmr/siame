<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SIRPC · Diagnóstico</title><link rel="stylesheet" href="style.css?v=20260724-HR04"></head>
<body data-page="diagnostico"><main class="wrap"><section class="hero"><img src="logo-ucc.png" class="logo"><div><h1>SIRPC · Diagnóstico</h1><p>Prueba rápida de conexión con Google Apps Script</p></div></section><section class="card"><h2>🔧 Probar backend</h2><p class="help">Ingrese una cédula para verificar si el Apps Script lee la hoja PlanesCurso.</p><div id="msg" class="hidden"></div><div class="row"><div class="field"><label>Cédula/correo</label><input id="q" value="57432992"></div><button class="btn-primary" id="b">Diagnosticar</button></div><pre id="out" class="codebox"></pre></section></main><script src="config.js?v=20260724-HR04"></script><script>
const API_URL=(window.SIRPC_CONFIG||{}).API_URL||'';
function jsonp(action,payload){return new Promise((res,rej)=>{const cb='cb_'+Date.now();const s=document.createElement('script');window[cb]=r=>{delete window[cb];s.remove();res(r)};s.onerror=()=>rej(new Error('No conectó'));s.src=API_URL+'?action='+encodeURIComponent(action)+'&payload='+encodeURIComponent(JSON.stringify(payload||{}))+'&callback='+cb+'&_='+Date.now();document.body.appendChild(s);});}
document.getElementById('b').onclick=async()=>{document.getElementById('out').textContent='Consultando...';try{const r=await jsonp('diagnostico',{query:document.getElementById('q').value});document.getElementById('out').textContent=JSON.stringify(r,null,2)}catch(e){document.getElementById('out').textContent=e.message}};
</script></body></html>
